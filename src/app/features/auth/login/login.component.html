<div class="py-12 max-w-md mx-auto space-y-6">
  <div class="glass-panel p-8 rounded-3xl border border-slate-800 space-y-6">
    <div class="text-center space-y-2">
      <div class="w-12 h-12 rounded-2xl bg-cyan-500/20 text-cyan-400 mx-auto flex items-center justify-center border border-cyan-500/30">
        <mat-icon class="!text-24px">lock</mat-icon>
      </div>
      <h1 class="text-2xl font-black text-white font-display">Iniciar Sesión</h1>
      <p class="text-xs text-slate-400">Accede a tu cuenta de CyberTech Pro</p>
    </div>

    <!-- Quick Demo Accounts Switcher -->
    <div class="p-3 rounded-2xl bg-slate-900 border border-slate-800 space-y-2">
      <span class="text-[11px] font-mono text-slate-400 block text-center uppercase tracking-wider">Cuentas Rápidas de Prueba:</span>
      <div class="flex gap-2">
        <button (click)="useDemoUser('admin')" class="flex-1 py-1.5 rounded-lg bg-indigo-950 text-indigo-300 border border-indigo-800 text-[11px] font-semibold hover:bg-indigo-900 cursor-pointer">
          👑 Admin Pro
        </button>
        <button (click)="useDemoUser('client')" class="flex-1 py-1.5 rounded-lg bg-cyan-950 text-cyan-300 border border-cyan-800 text-[11px] font-semibold hover:bg-cyan-900 cursor-pointer">
          🛒 Cliente Demo
        </button>
      </div>
    </div>

    @if (!showRecovery()) {
      <form (submit)="onLogin(); $event.preventDefault()" class="space-y-4 text-xs">
        <div>
          <label class="text-slate-400">Correo Electrónico</label>
          <input [(ngModel)]="email" name="email" type="email" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white mt-1 focus:border-cyan-500 focus:outline-none" />
        </div>
        <div>
          <div class="flex justify-between items-center">
            <label class="text-slate-400">Contraseña</label>
            <button type="button" (click)="showRecovery.set(true)" class="text-cyan-400 hover:underline text-[11px]">¿Olvidaste tu contraseña?</button>
          </div>
          <input [(ngModel)]="password" name="password" type="password" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white mt-1 focus:border-cyan-500 focus:outline-none" />
        </div>
        <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold text-xs shadow-lg shadow-cyan-500/20 cursor-pointer">
          Ingresar a la Plataforma
        </button>
      </form>
    } @else {
      <!-- Recovery Form (HU-03) -->
      <div class="space-y-4 text-xs">
        <p class="text-slate-300">Ingresa tu correo para recibir las instrucciones de recuperación:</p>
        <input [(ngModel)]="recoveryEmail" placeholder="correo@ejemplo.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:border-cyan-500 focus:outline-none" />
        <div class="flex gap-2">
          <button (click)="sendRecovery()" class="flex-1 py-2.5 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white font-bold cursor-pointer">Enviar Enlace</button>
          <button (click)="showRecovery.set(false)" class="px-4 py-2.5 rounded-xl bg-slate-800 text-slate-300 cursor-pointer">Volver</button>
        </div>
      </div>
    }

    <div class="text-center text-xs text-slate-400 border-t border-slate-800 pt-4">
      ¿No tienes una cuenta aún?
      <a routerLink="/auth/registro" class="text-cyan-400 font-bold hover:underline ml-1">Regístrate gratis</a>
    </div>
  </div>
</div>
